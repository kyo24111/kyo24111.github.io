<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24111 — Flight Record</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fff; --surface: #f5f5f5; --surface2: #ebebeb;
      --border: #e0e0e0; --text: #111; --mid: #444; --muted: #888; --dim: #ccc;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Poppins', 'Noto Sans JP', sans-serif; font-size: 14px; }

    /* ── HEADER ── */
    .page-header { background: #111; color: #fff; padding: 32px 48px 28px; }
    .breadcrumb { font-size: 10px; letter-spacing: .1em; color: rgba(255,255,255,.25); margin-bottom: 10px; }
    .breadcrumb a { color: rgba(255,255,255,.45); text-decoration: none; }
    .header-bottom { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .page-header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; }
    .tab-bar { display: flex; gap: 6px; flex-shrink: 0; }
    .tab-btn { background: none; border: 1px solid rgba(255,255,255,.25); color: rgba(255,255,255,.45); font-family: 'Poppins', sans-serif; font-size: 9px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: 5px 14px; cursor: pointer; transition: all .15s; }
    .tab-btn.active { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.65); color: #fff; }
    .tab-btn:hover:not(.active) { border-color: rgba(255,255,255,.45); color: rgba(255,255,255,.8); }

    /* ── TABS ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── MAP TAB ── */
    .map-controls { display: flex; align-items: center; gap: 16px; padding: 16px 48px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .ctrl-group { display: flex; align-items: center; gap: 8px; }
    .ctrl-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .ctrl-input { font-family: 'Poppins', sans-serif; font-size: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 5px 10px; outline: none; }
    .ctrl-input:focus { border-color: var(--mid); }
    .ctrl-btn { font-family: 'Poppins', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--text); background: var(--text); color: #fff; padding: 6px 16px; cursor: pointer; transition: all .15s; }
    .ctrl-btn.secondary { background: none; color: var(--text); }
    .ctrl-btn:hover { opacity: .75; }
    .map-stat { font-size: 11px; color: var(--muted); margin-left: auto; }
    #map { height: calc(100vh - 220px); min-height: 400px; }

    /* ── STATS TAB ── */
    .stats-container { max-width: 900px; padding: 48px 48px 80px; }
    .stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); margin-bottom: 48px; }
    .stat-card { background: var(--bg); padding: 24px 28px; }
    .stat-card .s-label { font-size: 9px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .stat-card .s-val { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
    .stat-card .s-unit { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .stats-section { margin-bottom: 40px; }
    .stats-section h3 { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .rank-table { width: 100%; border-collapse: collapse; }
    .rank-table td { padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
    .rank-table td:first-child { width: 28px; font-size: 10px; color: var(--dim); font-weight: 600; }
    .rank-table td:last-child { text-align: right; font-weight: 600; color: var(--mid); font-size: 12px; }
    .rank-bar-wrap { height: 4px; background: var(--surface2); margin-top: 5px; }
    .rank-bar { height: 4px; background: #111; }

    .year-chart { display: flex; flex-direction: column; gap: 10px; }
    .year-row { display: grid; grid-template-columns: 48px 1fr 36px; align-items: center; gap: 12px; font-size: 12px; }
    .year-bar-wrap { height: 18px; background: var(--surface2); }
    .year-bar { height: 18px; background: #111; }
    .year-count { text-align: right; font-weight: 600; font-size: 12px; color: var(--mid); }

    .stats-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }

    /* ── RAW DATA TAB ── */
    .data-container { padding: 32px 48px 80px; }
    .data-controls { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-select { font-family: 'Poppins', sans-serif; font-size: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 6px 10px; outline: none; cursor: pointer; }
    .data-count { font-size: 11px; color: var(--muted); margin-left: auto; }
    .flight-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .flight-table th { text-align: left; padding: 10px 14px; background: var(--surface); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
    .flight-table th:hover { color: var(--text); }
    .flight-table th.sorted { color: var(--text); }
    .flight-table th .sort-icon { margin-left: 4px; font-size: 9px; }
    .flight-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .flight-table tr:hover td { background: var(--surface); }
    .route { font-weight: 600; }
    .cls-badge { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .08em; padding: 2px 7px; border: 1px solid var(--border); color: var(--muted); }
    .cls-C { border-color: #111; color: #111; }
    .cls-F { border-color: #111; color: #111; background: #111; color: #fff; }

    /* ── LOAD UI ── */
    .load-ui { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; gap: 16px; }
    .load-ui p { font-size: 13px; color: var(--muted); }
    .load-btn { font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--text); background: none; color: var(--text); padding: 10px 24px; cursor: pointer; }
    .load-btn:hover { background: var(--text); color: #fff; }
    #csv-file-input { display: none; }

    @media (max-width: 640px) {
      .page-header { padding: 24px 20px 20px; }
      .map-controls { padding: 12px 20px; }
      .stats-container, .data-container { padding: 28px 20px 60px; }
      .stat-cards { grid-template-columns: 1fr 1fr; }
      .stats-two-col { grid-template-columns: 1fr; gap: 28px; }
    }
  </style>
</head>

<div class="page-header">
  <div class="breadcrumb"><a href="/index.html">24111</a></div>
  <div class="header-bottom">
    <h1>Flight Record</h1>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab(this,'stats')">Stats</button>
      <button class="tab-btn" onclick="switchTab(this,'map')">Map</button>
      <button class="tab-btn" onclick="switchTab(this,'data')">Raw Data</button>
    </div>
  </div>
</div>

<!-- ══ MAP ══ -->
<div id="panel-map" class="tab-panel">
  <div class="map-controls">
    <div class="ctrl-group">
      <span class="ctrl-label">From</span>
      <input type="month" id="fromDate" class="ctrl-input">
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">To</span>
      <input type="month" id="toDate" class="ctrl-input">
    </div>
    <button class="ctrl-btn" onclick="applyFilter()">Apply</button>
    <button class="ctrl-btn secondary" onclick="resetFilter()">All</button>
    <span class="map-stat" id="mapStat">—</span>
  </div>
  <div id="map"></div>
</div>

<!-- ══ STATS ══ -->
<div id="panel-stats" class="tab-panel active">
  <div class="stats-container">
    <div class="stat-cards" id="statCards">
      <div class="stat-card"><div class="s-label">Total Flights</div><div class="s-val" id="sTotalFlights">—</div></div>
      <div class="stat-card"><div class="s-label">Total Distance</div><div class="s-val" id="sTotalDist">—</div><div class="s-unit">km</div></div>
      <div class="stat-card"><div class="s-label">Countries</div><div class="s-val" id="sCountries">—</div></div>
      <div class="stat-card"><div class="s-label">Airports</div><div class="s-val" id="sAirports">—</div></div>
    </div>
    <div class="stats-two-col">
      <div class="stats-section">
        <h3>Top Airports</h3>
        <table class="rank-table" id="airportTable"></table>
      </div>
      <div class="stats-section">
        <h3>Top Airlines</h3>
        <table class="rank-table" id="airlineTable"></table>
      </div>
    </div>
    <div class="stats-section" style="margin-top:40px;">
      <h3>Flights by Year</h3>
      <div class="year-chart" id="yearChart"></div>
    </div>
  </div>
</div>

<!-- ══ RAW DATA ══ -->
<div id="panel-data" class="tab-panel">
  <div class="data-container">
    <div class="data-controls">
      <select class="filter-select" id="yearFilter" onchange="renderTable()">
        <option value="">All Years</option>
      </select>
      <select class="filter-select" id="classFilter" onchange="renderTable()">
        <option value="">All Classes</option>
        <option value="Economy">Economy</option>
        <option value="Business">Business</option>
        <option value="First">First</option>
      </select>
      <span class="data-count" id="dataCount"></span>
    </div>
    <table class="flight-table" id="flightTable">
      <thead>
        <tr>
          <th onclick="sortTable('date')">Date <span class="sort-icon">↕</span></th>
          <th onclick="sortTable('flight_no')">Flight <span class="sort-icon">↕</span></th>
          <th onclick="sortTable('dep_iata')">From <span class="sort-icon">↕</span></th>
          <th onclick="sortTable('arr_iata')">To <span class="sort-icon">↕</span></th>
          <th>Dep</th>
          <th>Arr</th>
          <th onclick="sortTable('seat')">Seat <span class="sort-icon">↕</span></th>
          <th onclick="sortTable('class')">Class <span class="sort-icon">↕</span></th>
          <th onclick="sortTable('distance_km')">Dist <span class="sort-icon">↕</span></th>
        </tr>
      </thead>
      <tbody id="flightTbody"></tbody>
    </table>
  </div>
</div>

<div id="noDataUi" class="load-ui" style="display:none;">

// ── State ───────────────────────────────────────────────────────────────────
let FLIGHTS = [];
let MAP = null;
let mapLayers = [];
let sortKey = 'date';
let sortAsc = false;

// ── CSV Parse ────────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1)
    .filter(l => l.trim())
    .map(line => {
      const vals = line.split(',').map(v => v.trim());
      const obj = {};
      headers.forEach((h, i) => obj[h] = vals[i] || '');
      return obj;
    });
}

// ── Load CSV (fetch → file picker fallback) ──────────────────────────────────
async function loadData() {
  try {
    const resp = await fetch('./flights.csv');
    if (!resp.ok) throw new Error();
    const text = await resp.text();
    FLIGHTS = parseCSV(text);
    init();
  } catch {
    document.getElementById('noDataUi').style.display = 'flex';
    document.getElementById('panel-map').style.minHeight = '300px';
  }
}

function loadFromFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    FLIGHTS = parseCSV(ev.target.result);
    document.getElementById('noDataUi').style.display = 'none';
    init();
  };
  reader.readAsText(file);
}

// ── Init ─────────────────────────────────────────────────────────────────────
function init() {
  populateYearFilter();

  renderStats(FLIGHTS);

}

// ── Tab ──────────────────────────────────────────────────────────────────────

  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + panel).classList.add('active');
  if (panel === 'map' && MAP) MAP.invalidateSize();
}

// ── Map ──────────────────────────────────────────────────────────────────────
function initMap() {
  if (MAP) return;
  MAP = L.map('map', { worldCopyJump: true }).setView([25, 10], 2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(MAP);
}

function gcPoints(c1, c2, n = 60) {
  const [lat1, lon1] = c1, [lat2, lon2] = c2;
  const R = Math.PI / 180;
  const p1 = [lat1*R, lon1*R], p2 = [lat2*R, lon2*R];
  const d = 2 * Math.asin(Math.sqrt(
    Math.sin((p2[0]-p1[0])/2)**2 + Math.cos(p1[0])*Math.cos(p2[0])*Math.sin((p2[1]-p1[1])/2)**2
  ));
  if (d < 0.001) return [[lat1,lon1],[lat2,lon2]];
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n;
    const A = Math.sin((1-f)*d)/Math.sin(d), B = Math.sin(f*d)/Math.sin(d);
    const x = A*Math.cos(p1[0])*Math.cos(p1[1]) + B*Math.cos(p2[0])*Math.cos(p2[1]);
    const y = A*Math.cos(p1[0])*Math.sin(p1[1]) + B*Math.cos(p2[0])*Math.sin(p2[1]);
    const z = A*Math.sin(p1[0]) + B*Math.sin(p2[0]);
    pts.push([Math.atan2(z, Math.sqrt(x*x+y*y))/R, Math.atan2(y,x)/R]);
  }
  return pts;
}

function renderMapFlights(flights) {
  mapLayers.forEach(l => MAP.removeLayer(l));
  mapLayers = [];

  // city name lookup from flight data
  const cityOf = {};
  flights.forEach(f => {
    if (f.dep_iata && f.dep_city) cityOf[f.dep_iata] = f.dep_city;
    if (f.arr_iata && f.arr_city) cityOf[f.arr_iata] = f.arr_city;
  });

  // group flights per airport
  const apFlights = {};
  flights.forEach(f => {
    [f.dep_iata, f.arr_iata].forEach(iata => {
      if (!iata || !AIRPORTS[iata]) return;
      (apFlights[iata] = apFlights[iata] || []).push(f);
    });
  });

  Object.entries(apFlights).forEach(([iata, aFlights]) => {
    const c = AIRPORTS[iata];
    const count = aFlights.length;
    const sorted = aFlights.slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    const city = cityOf[iata] || '';

    const rows = sorted.map(f => {
      const d = f.date ? f.date.slice(2).replace(/-/g, '') : '–';
      const route = `${f.dep_iata || '?'} → ${f.arr_iata || '?'}`;
      const airline = f.airline || '';
      return `<tr>
        <td style="color:#999;padding-right:10px;white-space:nowrap;vertical-align:top">${d}</td>
        <td style="padding-right:10px;white-space:nowrap;vertical-align:top;font-weight:600">${route}</td>
        <td style="color:#666;vertical-align:top">${airline}</td>
      </tr>`;
    }).join('');

    const html = `<div style="font-family:'SF Mono','Courier New',monospace;min-width:240px;max-width:290px">
      <div style="font-size:13px;font-weight:700;margin-bottom:2px;font-family:sans-serif">${iata}${city ? '<span style="font-weight:400;color:#888"> · ' + city + '</span>' : ''}</div>
      <div style="color:#aaa;font-size:10px;margin-bottom:8px;font-family:sans-serif">${count} flight${count !== 1 ? 's' : ''}</div>
      <table style="border-collapse:collapse;font-size:11px;width:100%"><tbody>${rows}</tbody></table>
    </div>`;

    const dot = L.circleMarker(c, {
      radius: 4.5, color: '#111', fillColor: '#111', fillOpacity: 1, weight: 0
    }).bindPopup(html, { maxWidth: 300 });
    dot.on('mouseover', function() { this.openPopup(); });
    dot.addTo(MAP);
    mapLayers.push(dot);
  });

  document.getElementById('mapStat').textContent = `${flights.length} flights`;
}

function applyFilter() {
  const from = document.getElementById('fromDate').value;
  const to   = document.getElementById('toDate').value;
  const filtered = FLIGHTS.filter(f => {
    const ym = f.date ? f.date.slice(0,7) : '';
    if (from && ym < from) return false;
    if (to   && ym > to)   return false;
    return true;
  });
  renderMapFlights(filtered);
}

function resetFilter() {
  document.getElementById('fromDate').value = '';
  document.getElementById('toDate').value   = '';
  renderMapFlights(FLIGHTS);
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function haversine(c1, c2) {
  const R = 6371;
  const dLat = (c2[0]-c1[0]) * Math.PI/180;
  const dLon = (c2[1]-c1[1]) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(c1[0]*Math.PI/180)*Math.cos(c2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(a)));
}

function renderStats(flights) {
  // Summary
  const countries = new Set(flights.flatMap(f => [f.dep_country, f.arr_country]).filter(Boolean));
  const airports  = new Set(flights.flatMap(f => [f.dep_iata, f.arr_iata]).filter(Boolean));
  let totalDist = 0;
  flights.forEach(f => {
    if (f.distance_km) {
      totalDist += parseInt(f.distance_km) || 0;
    } else if (AIRPORTS[f.dep_iata] && AIRPORTS[f.arr_iata]) {
      totalDist += haversine(AIRPORTS[f.dep_iata], AIRPORTS[f.arr_iata]);
    }
  });
  document.getElementById('sTotalFlights').textContent = flights.length;
  document.getElementById('sTotalDist').textContent = totalDist ? totalDist.toLocaleString() : '—';
  document.getElementById('sCountries').textContent = countries.size || '—';
  document.getElementById('sAirports').textContent  = airports.size  || '—';

  // Top airports
  const apCount = {};
  flights.forEach(f => {
    if (f.dep_iata) apCount[f.dep_iata] = (apCount[f.dep_iata]||0) + 1;
    if (f.arr_iata) apCount[f.arr_iata] = (apCount[f.arr_iata]||0) + 1;
  });
  const topAP = Object.entries(apCount).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxAP = topAP[0]?.[1] || 1;
  document.getElementById('airportTable').innerHTML = topAP.map(([ap,n]) =>
    `<tr><td>${topAP.indexOf([ap,n])+1||''}</td><td>${ap}<div class="rank-bar-wrap"><div class="rank-bar" style="width:${n/maxAP*100}%"></div></div></td><td>${n}</td></tr>`
  ).join('');
  // Fix indexOf issue
  const apRows = topAP.map(([ap,n],i) =>
    `<tr><td>${i+1}</td><td>${ap}<div class="rank-bar-wrap"><div class="rank-bar" style="width:${n/maxAP*100}%"></div></div></td><td>${n}</td></tr>`
  ).join('');
  document.getElementById('airportTable').innerHTML = apRows;

  // Top airlines
  const alCount = {};
  flights.forEach(f => { if (f.airline) alCount[f.airline] = (alCount[f.airline]||0) + 1; });
  const topAL = Object.entries(alCount).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxAL = topAL[0]?.[1] || 1;
  document.getElementById('airlineTable').innerHTML = topAL.map(([al,n],i) =>
    `<tr><td>${i+1}</td><td>${al}<div class="rank-bar-wrap"><div class="rank-bar" style="width:${n/maxAL*100}%"></div></div></td><td>${n}</td></tr>`
  ).join('');

  // Flights by year
  const byYear = {};
  flights.forEach(f => { const y = f.date?.slice(0,4); if (y) byYear[y] = (byYear[y]||0)+1; });
  const years = Object.keys(byYear).sort();
  const maxY = Math.max(...Object.values(byYear), 1);
  document.getElementById('yearChart').innerHTML = years.map(y =>
    `<div class="year-row"><span>${y}</span><div class="year-bar-wrap"><div class="year-bar" style="width:${byYear[y]/maxY*100}%"></div></div><span class="year-count">${byYear[y]}</span></div>`
  ).join('');
}

// ── Raw Data Table ────────────────────────────────────────────────────────────
function populateYearFilter() {
  const years = [...new Set(FLIGHTS.map(f => f.date?.slice(0,4)).filter(Boolean))].sort().reverse();
  const sel = document.getElementById('yearFilter');
  years.forEach(y => { const o = document.createElement('option'); o.value = y; o.textContent = y; sel.appendChild(o); });
}

function sortTable(key) {
  if (sortKey === key) { sortAsc = !sortAsc; } else { sortKey = key; sortAsc = false; }
  renderTable();
}

function renderTable() {
  const yearF  = document.getElementById('yearFilter').value;
  const classF = document.getElementById('classFilter').value;
  let rows = FLIGHTS.filter(f => {
    if (yearF  && f.date?.slice(0,4) !== yearF) return false;
    if (classF && f.class !== classF) return false;
    return true;
  });
  rows.sort((a,b) => {
    const va = a[sortKey]||'', vb = b[sortKey]||'';
    const cmp = isNaN(va) ? va.localeCompare(vb) : parseFloat(va) - parseFloat(vb);
    return sortAsc ? cmp : -cmp;
  });
  document.getElementById('dataCount').textContent = `${rows.length} flights`;
  const depCity  = r => r.dep_city  ? `<span style="font-size:11px;color:#888;margin-left:4px;">${r.dep_city}</span>` : '';
  const arrCity  = r => r.arr_city  ? `<span style="font-size:11px;color:#888;margin-left:4px;">${r.arr_city}</span>` : '';
  const dist     = r => {
    if (r.distance_km) return r.distance_km.toLocaleString();
    if (AIRPORTS[r.dep_iata] && AIRPORTS[r.arr_iata]) return haversine(AIRPORTS[r.dep_iata], AIRPORTS[r.arr_iata]).toLocaleString();
    return '—';
  };
  const clsBadge = cls => `<span class="cls-badge cls-${(cls||'Y')[0]}">${cls||'—'}</span>`;
  document.getElementById('flightTbody').innerHTML = rows.map(r => `
    <tr>
      <td>${r.date||'—'}</td>
      <td>${r.flight_no||'—'}</td>
      <td class="route">${r.dep_iata||'—'}${depCity(r)}</td>
      <td class="route">${r.arr_iata||'—'}${arrCity(r)}</td>
      <td>${r.dep_time||'—'}</td>
      <td>${r.arr_time||'—'}</td>
      <td>${r.seat||'—'}</td>
      <td>${clsBadge(r.class)}</td>
      <td style="text-align:right;">${dist(r)}</td>
    </tr>`).join('');
}

// ── Boot ─────────────────────────────────────────────────────────────────────
loadData();
</script>

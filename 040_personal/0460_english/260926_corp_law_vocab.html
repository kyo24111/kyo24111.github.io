<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会社法 英単語集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:    #ffffff;
      --line:  #e8e8e8;
      --soft:  #f6f6f6;
      --text:  #111111;
      --muted: #888888;
      --light: #cccccc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Poppins', 'Noto Sans JP', sans-serif;
      font-size: 14px; line-height: 1.6;
    }
    .page { max-width: 1080px; margin: 0 auto; padding: 48px 24px 100px; }

    .header {
      display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
      margin-bottom: 24px; padding-bottom: 20px; border-bottom: 2px solid var(--text);
    }
    .header h1 { font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
    .header p  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .back-link { font-size: 12px; color: var(--muted); text-decoration: none; white-space: nowrap; }
    .back-link:hover { color: var(--text); }

    /* ── CONTROLS ── */
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .controls input, .controls select {
      font: inherit; font-size: 13px; color: var(--text);
      border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; background: var(--bg);
    }
    .controls input { flex: 1 1 220px; min-width: 0; }
    .toggle { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .toggle button {
      font: inherit; font-size: 12px; padding: 7px 10px; border: 0; background: var(--bg);
      color: var(--muted); cursor: pointer;
    }
    .toggle button + button { border-left: 1px solid var(--line); }
    .toggle button.on { background: var(--text); color: var(--bg); }
    .count { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

    /* ── TABLE ── */
    .table-wrap { overflow-x: auto; border-top: 1px solid var(--text); }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th {
      font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: var(--muted); text-align: left; padding: 10px 10px;
      border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; white-space: nowrap;
    }
    th:hover { color: var(--text); }
    th .arrow { display: inline-block; width: 10px; margin-left: 4px; color: var(--text); }
    td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr:hover td { background: var(--soft); }
    td.no   { color: var(--light); font-size: 12px; width: 40px; }
    td.en   { font-weight: 600; white-space: nowrap; }
    td.ja   { white-space: nowrap; }
    td.def  { color: #444; font-size: 13px; }
    .badge {
      display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px;
      border: 1px solid var(--light); color: #555; white-space: nowrap;
    }
    /* 暗記モード：隠したセルはクリックで表示 */
    .hide-ja td.ja span, .hide-en td.en span { background: var(--line); color: transparent; border-radius: 3px; cursor: pointer; }
    td.revealed span { background: none !important; color: inherit !important; }
    .empty { text-align: center; color: var(--muted); padding: 32px; }

    @media (max-width: 600px) {
      .page { padding: 32px 16px 80px; }
      .header { flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
<!-- crumbs:start --><style>.wl-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:100%;padding:10px 16px;font-family:Poppins,"Noto Sans JP",sans-serif;font-size:11px;font-weight:500;letter-spacing:.04em;line-height:1.4;color:#888;background:#fff;border-bottom:1px solid #eee;position:relative;z-index:5}.wl-crumbs a{color:#888;text-decoration:none}.wl-crumbs a:hover{color:#111;text-decoration:underline}.wl-crumbs .s{color:#ccc}.wl-crumbs .c{color:#111;font-weight:700}@media print{.wl-crumbs{display:none}}</style><nav class="wl-crumbs" aria-label="breadcrumb"><a href="../../index.html">24111</a><span class="s">/</span><a href="../index.html">personal</a><span class="s">/</span><a href="index.html">english</a><span class="s">/</span><span class="c">会社法 英単語集</span></nav><!-- crumbs:end -->
<div class="page">
  <div class="header">
    <div>
      <h1>会社法 英単語集</h1>
      <p>Corporate Law Vocabulary — 日本語 / English / English definition</p>
    </div>
    <a class="back-link" href="index.html">← English</a>
  </div>

  <div class="controls">
    <input id="q" type="search" placeholder="Search (日本語 / English / definition)">
    <select id="cat"><option value="">All categories</option></select>
    <div class="toggle" id="mode">
      <button data-mode="" class="on">Show all</button>
      <button data-mode="hide-ja">Hide JP</button>
      <button data-mode="hide-en">Hide EN</button>
    </div>
  </div>
  <div class="count" id="count"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-key="id">#<span class="arrow"></span></th>
          <th data-key="ja">日本語<span class="arrow"></span></th>
          <th data-key="en">English<span class="arrow"></span></th>
          <th data-key="def">Definition<span class="arrow"></span></th>
          <th data-key="cat">Category<span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// WORDS: 1行=1語。ここに追記するだけで表に反映される
//   ja  : 日本語
//   en  : 英語
//   def : 簡単な英英説明（1文）
//   cat : カテゴリ（Corporation / Governance / Shares / Finance / M&A / Contract ...）
// ─────────────────────────────────────────────
const WORDS = [
  { ja: "株式会社",     en: "stock company / corporation", def: "A company owned by shareholders whose liability is limited to what they invested.", cat: "Corporation" },
  { ja: "取締役",       en: "director",                    def: "A person elected by shareholders to manage the company.",                          cat: "Governance" },
  { ja: "株主総会",     en: "general meeting of shareholders", def: "A meeting where shareholders vote on important company decisions.",            cat: "Governance" },
  { ja: "定款",         en: "articles of incorporation",   def: "The basic rules of a company, written when it is created.",                        cat: "Corporation" },
  { ja: "新株予約権",   en: "stock acquisition right",     def: "A right to receive new shares from the company at a fixed price in the future.",   cat: "Shares" },
  { ja: "プットオプション（売付請求権）", en: "put option", def: "A right to force another party to buy your shares at an agreed price.", cat: "M&A" },
  { ja: "コールオプション（買付請求権）", en: "call option", def: "A right to force another party to sell you their shares at an agreed price.", cat: "M&A" },
  { ja: "表明保証",     en: "representations and warranties", def: "Statements of fact that one party promises are true, with liability if they are false.", cat: "Contract" },
  { ja: "償還請求権（取得請求権）", en: "redemption rights", def: "A right of investors to require the company to buy back their shares.", cat: "Shares" },
  { ja: "強制売却権（ドラッグ・アロング）", en: "drag-along right", def: "A right of majority holders to force minority holders to join in selling the company.", cat: "M&A" },
  { ja: "共同売却権（タグ・アロング）", en: "tag-along right", def: "A right of minority holders to sell their shares on the same terms when the majority sells.", cat: "M&A" },
  { ja: "ストップ高",   en: "limit up",                    def: "When a stock price rises to the maximum allowed in one day and cannot go higher.",  cat: "Market" },
  { ja: "ストップ安",   en: "limit down",                  def: "When a stock price falls to the maximum allowed in one day and cannot go lower.",  cat: "Market" },
  { ja: "名義株",       en: "nominee shares",              def: "Shares registered in one person's name while another person is the real (beneficial) owner.", cat: "Shares" },
];

// ── state ──
const state = { key: "id", dir: 1, q: "", cat: "" };
WORDS.forEach((w, i) => w.id = i + 1);

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// カテゴリの選択肢を自動生成
[...new Set(WORDS.map(w => w.cat))].sort().forEach(c => {
  $("#cat").insertAdjacentHTML("beforeend", `<option value="${esc(c)}">${esc(c)}</option>`);
});

function render() {
  const q = state.q.toLowerCase();
  const rows = WORDS
    .filter(w => !state.cat || w.cat === state.cat)
    .filter(w => !q || [w.ja, w.en, w.def].some(v => v.toLowerCase().includes(q)))
    .sort((a, b) => {
      const x = a[state.key], y = b[state.key];
      const r = typeof x === "number" ? x - y : String(x).localeCompare(String(y), state.key === "ja" ? "ja" : "en");
      return r * state.dir;
    });

  $("#tbody").innerHTML = rows.length ? rows.map(w => `
    <tr>
      <td class="no">${w.id}</td>
      <td class="ja"><span>${esc(w.ja)}</span></td>
      <td class="en"><span>${esc(w.en)}</span></td>
      <td class="def">${esc(w.def)}</td>
      <td><span class="badge">${esc(w.cat)}</span></td>
    </tr>`).join("") : `<tr><td colspan="5" class="empty">No matches</td></tr>`;

  $("#count").textContent = `${rows.length} / ${WORDS.length} words`;
  document.querySelectorAll("th").forEach(th => {
    th.querySelector(".arrow").textContent = th.dataset.key === state.key ? (state.dir > 0 ? "↑" : "↓") : "";
  });
}

document.querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
  const k = th.dataset.key;
  state.dir = state.key === k ? -state.dir : 1;
  state.key = k;
  render();
}));
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#cat").addEventListener("change", e => { state.cat = e.target.value; render(); });
$("#mode").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#mode button").forEach(x => x.classList.toggle("on", x === b));
  $("table").className = b.dataset.mode;
});
$("#tbody").addEventListener("click", e => {
  const td = e.target.closest("td.ja, td.en"); if (td) td.classList.toggle("revealed");
});

render();
</script>
</body>
</html>

<h1>Book Digest</h1>
<div class="sub">気になる本を入れる → 簡易版記事で中身を掴む → 刺さったら買って読む</div>
<div class="flow"><span>本を指定</span><i>→</i><span>リサーチ（出版社・試し読み・書評・著者対談）</span><i>→</i><span>TL;DR で判定</span><i>→</i><span>買う / 見送る</span></div>
<div id="list"></div>

</div>
<script>
/* 1冊=1行。新しい本は先頭に足す。status: 未購入 / 購入 / 読了 / 見送り */
const DIGESTS = [
  {file:'261120_america_b_side.html', title:'日本人が知らないアメリカ', author:'加藤喜之・竹下隆一郎', pub:'文春新書 / 2026', verdict:'入口として買い（宗教・テクノロジー・政治の章を拾い読み）', status:'未購入', added:'2026-11-20'},
];
document.getElementById('list').innerHTML = DIGESTS.map(d =>
  `<a class="item" href="${d.file}"><div class="t">${d.title}</div>
   <div class="m">${d.author} · ${d.pub} · 追加 ${d.added}</div>
   <div class="v"><b>${d.status}</b>${d.verdict}</div></a>`).join('');

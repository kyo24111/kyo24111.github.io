<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24111</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #ffffff;
      --text:  #111111;
      --mid:   #555555;
      --muted: #999999;
      --dim:   #cccccc;
      --border:#e0e0e0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      min-height: 100vh;
    }

    .header {
      background: #111;
      color: #fff;
      padding: 52px 48px 44px;
    }
    .header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1;
    }

    .main {
      max-width: 600px;
      padding: 52px 48px 80px;
    }

    .dir-block {
      margin-bottom: 44px;
    }
    .dir-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 14px;
    }
    .dir-num {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .12em;
      color: var(--dim);
      min-width: 32px;
    }
    .dir-name {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .sub-list {
      padding-left: 44px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sub-item {
      display: block;
      padding: 5px 0;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -.01em;
    }
    .sub-item:hover {
      color: var(--mid);
    }
    .sub-item.plain {
      color: var(--muted);
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .header { padding: 36px 24px 32px; }
      .main { padding: 40px 24px 60px; }
    }
  </style>
</head>
<body>

<header class="header">

</header>

<main class="main">

    <div class="sub-list">
      <a class="sub-item" href="030_research/032_geo-history/index.html">032 geo-history</a>

    </div>
    <div class="sub-list">

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24111 — Exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --fg:#111; --sub:#666; --mute:#999; --line:#e5e5e5; --bg:#fff; --soft:#f6f6f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:'Poppins','Noto Sans JP',sans-serif; line-height:1.6; }
  main { max-width:960px; margin:0 auto; padding:48px 16px 64px; }
  h1 { font-size:2rem; font-weight:600; margin:0; letter-spacing:.02em; }
  .lead { color:var(--sub); margin:4px 0 32px; font-size:.9rem; }
  h2 { font-size:1.1rem; font-weight:600; margin:48px 0 16px; padding-bottom:8px;
       border-bottom:1px solid var(--fg); }
  h3 { font-size:.85rem; font-weight:500; color:var(--sub); margin:20px 0 8px; }

  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
           background:var(--line); border:1px solid var(--line); }
  .stat { background:var(--bg); padding:16px; }
  .stat b { display:block; font-size:1.8rem; font-weight:600; line-height:1.2; }
  .stat span { font-size:.75rem; color:var(--sub); }

  #map { height:420px; margin-top:24px; border:1px solid var(--line); background:var(--soft); }
  .legend { font-size:.75rem; color:var(--sub); margin-top:8px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin:0 4px 0 12px; vertical-align:middle; }
  .dot.v { background:var(--fg); } .dot.b { border:1.5px solid var(--mute); }

  .flags { display:flex; flex-wrap:wrap; gap:6px; }
  .flag { display:flex; align-items:center; gap:6px; padding:4px 10px; border:1px solid var(--line);
          border-radius:999px; font-size:.8rem; }
  .flag em { font-style:normal; color:var(--mute); font-size:.7rem; }

  .year { display:grid; grid-template-columns:64px 1fr; gap:0 16px; border-top:1px solid var(--line); padding:12px 0; }
  .year > b { font-size:1rem; font-weight:600; }
  .trip { display:grid; grid-template-columns:28px 1fr; gap:8px; font-size:.85rem; padding:2px 0; }
  .trip .m { color:var(--mute); font-variant-numeric:tabular-nums; }

  footer { margin-top:56px; padding-top:16px; border-top:1px solid var(--line);
           display:flex; flex-wrap:wrap; gap:16px; font-size:.8rem; color:var(--sub); }
  footer a { color:var(--fg); }
  footer .upd { margin-left:auto; color:var(--mute); }

  @media (max-width:600px) {
    h1 { font-size:1.6rem; }
    .stats { grid-template-columns:repeat(2,1fr); }
    #map { height:300px; }
    .year { grid-template-columns:1fr; }
    .year > b { margin-bottom:4px; }
  }
</style>
</head>
<body>
<main>
  <h1>24111</h1>
  <p class="lead">Exploration history</p>

  <section class="stats" id="stats"></section>
  <div id="map"></div>
  <p class="legend"><span class="dot v"></span>Explored <span class="dot b"></span>Bucket list</p>

  <h2>Countries</h2>
  <div id="countries"></div>

  <h2>History</h2>
  <div id="history"></div>

  <footer>
    <a href="https://twitter.com/kyo24111">Twitter</a>
    <a href="https://github.com/kyo24111">GitHub</a>
    <a href="https://www.instagram.com/kyo24111/">Instagram</a>
    <a href="https://www.facebook.com/kyo24111">Facebook</a>
    <a href="https://app.ens.domains/name/kyo24111.eth">ENS</a>
    <span class="upd" id="updated"></span>
  </footer>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C = DATA.countries;
const visited = Object.keys(DATA.cities);

// Stats
$('stats').innerHTML = [
  [Object.keys(C).length, 'Countries & regions'],
  [visited.length, 'Cities'],
  [DATA.trips.length, 'Trips (months)'],
  [DATA.flights, 'Flights'],
].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');

// Countries by region (in order of first visit)
$('countries').innerHTML = DATA.regions.map(rg => {
  const list = Object.entries(C).filter(([, v]) => v.region === rg)
    .sort((a, b) => a[1].first.localeCompare(b[1].first));
  return `<h3>${rg} / ${list.length}</h3><div class="flags">` + list.map(([name, v]) =>
    `<span class="flag" title="first: ${v.first}">${v.flag} ${esc(name)} <em>${v.first.slice(0,4)}</em></span>`
  ).join('') + '</div>';
}).join('');

// History: year > month > country-grouped cities
const byYear = {};
DATA.trips.forEach(t => (byYear[t.month.slice(0,4)] ||= []).push(t));
$('history').innerHTML = Object.keys(byYear).sort().reverse().map(y =>
  `<div class="year"><b>${y}</b><div>` + byYear[y].map(t => {
    const g = {};
    t.places.forEach(([city, country]) => (g[country] ||= []).push(city));
    const txt = Object.entries(g).map(([k, cs]) =>
      `${C[k].flag} ${cs.filter(c => c !== k).map(esc).join(', ') || esc(k)}`).join('　');
    return `<div class="trip"><span class="m">${t.month.slice(5)}</span><span>${txt}</span></div>`;
  }).join('') + '</div></div>'
).join('');

$('updated').textContent = 'Last updated: ' + DATA.updated;

// Map
const map = L.map('map', { worldCopyJump: true, scrollWheelZoom: false }).setView([25, 20], 2);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri', maxZoom: 10,
}).addTo(map);
visited.forEach(c => L.circleMarker(DATA.cities[c], {
  radius: 4, color: '#111', weight: 1, fillColor: '#111', fillOpacity: .85,
}).bindTooltip(c).addTo(map));
DATA.bucket.forEach(([n, la, lo]) => L.circleMarker([la, lo], {
  radius: 4, color: '#999', weight: 1.5, fill: false,
}).bindTooltip(n + ' (bucket list)').addTo(map));
</script>
</body>
</html>

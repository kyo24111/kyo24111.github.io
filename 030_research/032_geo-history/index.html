  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #ffffff;
      --surface: #f7f7f7;
      --border:  #e8e8e8;
      --text:    #111111;
      --mid:     #555555;
      --muted:   #999999;
      --dim:     #cccccc;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: #111;
      color: #fff;
      padding: 40px 48px 36px;
    }
    .breadcrumb {
      font-size: 10px;
      letter-spacing: .1em;
      color: rgba(255,255,255,.2);
      margin-bottom: 12px;
    }
    .breadcrumb a { color: rgba(255,255,255,.45); text-decoration: none; }
    .breadcrumb a:hover { color: rgba(255,255,255,.8); }
    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    /* MAIN */
    .main {
      max-width: 560px;
      padding: 52px 48px 80px;
    }

    /* COUNTRY BLOCK */
    .country-block {
      margin-bottom: 36px;
    }

    .country-row {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      padding: 4px 0;
      margin-bottom: 6px;
    }
    .country-row:hover .country-name { opacity: .65; }

    .flag {
      font-size: 1.35rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .country-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.02em;
      transition: opacity .15s;
    }

    /* CITY LIST */
    .city-list {
      padding-left: 46px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .city-row {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      padding: 5px 0;
      border-top: 1px solid var(--surface);
    }
    .city-row:last-child { border-bottom: 1px solid var(--surface); }
    .city-row:hover .city-name { color: var(--mid); }

    .city-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--dim);
      flex-shrink: 0;
    }
    .city-name {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      transition: color .15s;
    }

    @media (max-width: 600px) {
      .header { padding: 28px 24px 24px; }
      .main { padding: 36px 24px 60px; }
    }
  </style>

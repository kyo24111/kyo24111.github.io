<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24111 / geo-history</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #ffffff;
      --surface: #f7f7f7;
      --border:  #e8e8e8;
      --text:    #111111;
      --mid:     #555555;
      --muted:   #999999;
      --dim:     #cccccc;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: #111;
      color: #fff;
      padding: 40px 48px 36px;
    }
    .breadcrumb {
      font-size: 10px;
      letter-spacing: .1em;
      color: rgba(255,255,255,.2);
      margin-bottom: 12px;
    }
    .breadcrumb a { color: rgba(255,255,255,.45); text-decoration: none; }
    .breadcrumb a:hover { color: rgba(255,255,255,.8); }
    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    /* MAIN */
    .main {
      max-width: 560px;
      padding: 52px 48px 80px;
    }

    /* COUNTRY BLOCK */
    .country-block {
      margin-bottom: 36px;
    }

    .country-row {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      padding: 4px 0;
      margin-bottom: 6px;
    }
    .country-row:hover .country-name { opacity: .65; }

    .flag {
      font-size: 1.35rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .country-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.02em;
      transition: opacity .15s;
    }

    /* CITY LIST */
    .city-list {
      padding-left: 46px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .city-row {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      padding: 5px 0;
      border-top: 1px solid var(--surface);
    }
    .city-row:last-child { border-bottom: 1px solid var(--surface); }
    .city-row:hover .city-name { color: var(--mid); }

    .city-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--dim);
      flex-shrink: 0;
    }
    .city-name {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      transition: color .15s;
    }

    @media (max-width: 600px) {
      .header { padding: 28px 24px 24px; }
      .main { padding: 36px 24px 60px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="breadcrumb"><a href="../../index.html">24111</a> / 030 / 032</div>
  <h1>geo-history</h1>
</header>

<main class="main">

  <div class="country-block">
    <a class="country-row" href="260416_senegal.html">
      <span class="flag">🇸🇳</span>
      <span class="country-name">Senegal</span>
    </a>
    <div class="city-list">
      <a class="city-row" href="260416_dakar.html">
        <span class="city-dot"></span>
        <span class="city-name">Dakar</span>
      </a>
    </div>
  </div>

  <div class="country-block">
    <a class="country-row" href="260416_cote_divoire.html">
      <span class="flag">🇨🇮</span>
      <span class="country-name">Côte d'Ivoire</span>
    </a>
    <div class="city-list">
      <a class="city-row" href="260416_abidjan.html">
        <span class="city-dot"></span>
        <span class="city-name">Abidjan</span>
      </a>
    </div>
  </div>

  <div class="country-block">
    <a class="country-row" href="260415_ghana.html">
      <span class="flag">🇬🇭</span>
      <span class="country-name">Ghana</span>
    </a>
    <div class="city-list">
      <a class="city-row" href="260416_accra.html">
        <span class="city-dot"></span>
        <span class="city-name">Accra</span>
      </a>
    </div>
  </div>

  <div class="country-block">
    <a class="country-row" href="260416_cape_verde.html">
      <span class="flag">🇨🇻</span>
      <span class="country-name">Cape Verde</span>
    </a>
    <div class="city-list">
      <a class="city-row" href="260416_praia.html">
        <span class="city-dot"></span>
        <span class="city-name">Praia</span>
      </a>
    </div>
  </div>

</main>

</body>
</html>

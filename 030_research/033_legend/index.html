  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #ffffff;
      --surface: #f4f4f4;
      --hover:   #ededed;
      --border:  #e0e0e0;
      --text:    #111111;
      --mid:     #555555;
      --muted:   #999999;
      --dim:     #cccccc;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
    }

    .header { background: #111; color: #fff; padding: 40px 48px 36px; }
    .breadcrumb { font-size: 10px; letter-spacing: .1em; color: rgba(255,255,255,.2); margin-bottom: 12px; }

    .header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; }

    .main { padding: 48px 48px 80px; max-width: 860px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px 18px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      min-height: 88px;
      transition: background .12s;
    }
    .tile:hover { background: var(--hover); }

    .tile-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -.01em;
      line-height: 1.3;
    }

    @media (max-width: 600px) {
      .header { padding: 28px 24px 24px; }
      .main { padding: 36px 24px 60px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    }
  </style>
</head>

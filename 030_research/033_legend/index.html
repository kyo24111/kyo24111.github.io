  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --text:    #111111;
      --mid:     #444444;
      --muted:   #888888;

    .page-header { background: #111; color: #fff; padding: 36px 48px 32px; }

    .main { max-width: 1120px; padding: 36px 48px 80px; }

    /* ── Filters ── */
    .filters { border: 1px solid var(--border); background: var(--surface); padding: 18px 20px 6px; margin-bottom: 18px; }
    .f-top { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }

    .f-search:focus { border-color: #111; }
    .f-sort { font: inherit; font-size: 12px; padding: 9px 10px; border: 1px solid var(--border); background: #fff; color: var(--text); cursor: pointer; }
    .f-reset { font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 9px 12px; border: 1px solid var(--border); background: #fff; color: var(--mid); cursor: pointer; }
    .f-reset:hover { border-color: #111; color: #111; }
    .f-toggle { display: none; font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 9px 12px; border: 1px solid #111; background: #111; color: #fff; cursor: pointer; }
    .f-group { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--border); }
    .f-label { flex: 0 0 92px; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-top: 7px; }
    .f-label .clr { display: block; margin-top: 4px; font-size: 10px; letter-spacing: .06em; text-transform: none; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline; visibility: hidden; }
    .f-label .clr.on { visibility: visible; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font: inherit; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 7px 10px; border: 1px solid var(--dim); background: #fff; color: var(--mid); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .1s, border-color .1s, color .1s; }
    .chip:hover { border-color: #111; color: #111; }
    .chip .n { font-size: 10px; color: var(--muted); font-weight: 500; }
    .chip.on { background: #111; border-color: #111; color: #fff; }
    .chip.on .n { color: rgba(255,255,255,.55); }
    .chip.zero { opacity: .35; }

    .result-bar { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 8px; font-size: 11px; color: var(--muted); gap: 12px; flex-wrap: wrap; }
    .result-bar b { color: #111; font-size: 13px; }
    .active-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .active-tags span { font-size: 10.5px; background: #111; color: #fff; padding: 3px 8px; cursor: pointer; }
    .active-tags span::after { content: ' ×'; opacity: .6; }

    /* ── List ── */
    .list { width: 100%; border-collapse: collapse; }
    .list th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 10px 10px; border-bottom: 2px solid #111; white-space: nowrap; user-select: none; }
    .list th.sortable { cursor: pointer; }
    .list th.sortable:hover { color: #111; }
    .list th .ar { display: inline-block; width: 10px; color: #111; }
    .list td { padding: 13px 10px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 12px; }
    .list tr.row { cursor: pointer; transition: background .1s; }
    .list tr.row:hover { background: var(--surface); }
    .p-name { font-size: 14px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }
    .p-name a { color: #111; text-decoration: none; }
    .p-name a:hover { text-decoration: underline; }
    .p-desc { font-family: 'Noto Sans JP', sans-serif; font-size: 11.5px; color: var(--mid); line-height: 1.65; margin-top: 4px; }
    .c-years { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--mid); }
    .c-years .era { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; }
    .c-added { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 11px; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag { font-size: 10px; font-weight: 500; color: var(--mid); border: 1px solid var(--dim); padding: 2px 6px; white-space: nowrap; cursor: pointer; }
    .tag:hover { border-color: #111; color: #111; }
    .tag.hit { background: #111; color: #fff; border-color: #111; }
    .c-nat { width: 150px; }
    .c-genre { width: 190px; }
    .empty { padding: 40px 0; text-align: center; color: var(--muted); font-size: 12px; display: none; }

    @media (max-width: 860px) {
      .page-header { padding: 24px 16px 20px; }
      .main { padding: 24px 16px 56px; }
      .filters { padding: 14px 14px 4px; }
      .f-toggle { display: inline-block; }
      .f-top { margin-bottom: 0; }
      .f-search { flex-basis: 100%; }
      #groups { display: none; margin-top: 12px; }
      .filters.open #groups { display: block; }
      .filters { padding-bottom: 14px; }
      .f-group { flex-direction: column; gap: 6px; }
      .f-label { flex: none; padding-top: 0; display: flex; gap: 10px; align-items: baseline; }
      .f-label .clr { margin-top: 0; }
      .chip { font-size: 12px; padding: 8px 10px; }
      .list thead { display: none; }
      .list, .list tbody, .list tr, .list td { display: block; width: 100% !important; }
      .list tr.row { padding: 14px 0; border-bottom: 1px solid var(--border); }
      .list td { border: none; padding: 0; }
      .list td.c-main { margin-bottom: 8px; }
      .list td.c-years, .list td.c-added { display: inline-block; width: auto !important; margin-right: 12px; font-size: 11px; }
      .list td.c-years .era { display: inline; margin: 0 0 0 6px; }
      .list td.c-added::before { content: 'added '; }
      .list td.c-nat, .list td.c-genre { margin-top: 6px; }
      .list td.c-nat .tags, .list td.c-genre .tags { display: inline-flex; }
    }

  </style>

/* 時代区分は生年から自動で決める */
const ERAS = [
  ['Ancient',      -9999, 499],
  ['Medieval',       500, 1499],
  ['Early Modern',  1500, 1799],
  ['19th Century',  1800, 1899],
  ['20th Century',  1900, 1959],
  ['Contemporary',  1960, 9999],
];
const eraOf = b => ERAS.find(e => b >= e[1] && b <= e[2])[0];
PEOPLE.forEach(p => { p.era = eraOf(p.born); });

const GROUPS = [
  { key: 'genre', label: 'Genre',       get: p => p.genre },
  { key: 'era',   label: 'Era',         get: p => [p.era], order: ERAS.map(e => e[0]) },
  { key: 'nat',   label: 'Nationality', get: p => p.nat },
];

const state = { q: '', sort: 'added', dir: 'desc', sel: { genre: new Set(), era: new Set(), nat: new Set() } };

const yr = y => y == null ? '' : (y < 0 ? 'BC ' + (-y) : String(y));
const years = p => p.died == null ? yr(p.born) + '–' : (p.born < 0 && p.died < 0 ? 'BC ' + (-p.born) + '–' + (-p.died) : yr(p.born) + '–' + yr(p.died));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* グループ内OR・グループ間AND。exceptKey を外した条件で件数を数える（ファセット件数用） */
function match(p, exceptKey) {
  if (state.q) {
    const t = (p.name + ' ' + p.desc + ' ' + p.nat.join(' ') + ' ' + p.genre.join(' ')).toLowerCase();
    if (!t.includes(state.q)) return false;
  }
  for (const g of GROUPS) {
    if (g.key === exceptKey) continue;
    const sel = state.sel[g.key];
    if (sel.size && !g.get(p).some(v => sel.has(v))) return false;
  }
  return true;
}

function renderGroups() {
  const box = document.getElementById('groups');
  box.innerHTML = GROUPS.map(g => {
    const all = {};
    PEOPLE.forEach(p => g.get(p).forEach(v => { all[v] = all[v] || 0; }));
    PEOPLE.filter(p => match(p, g.key)).forEach(p => g.get(p).forEach(v => { all[v]++; }));
    const total = {};
    PEOPLE.forEach(p => g.get(p).forEach(v => { total[v] = (total[v] || 0) + 1; }));
    const keys = Object.keys(all).sort(g.order
      ? (a, b) => g.order.indexOf(a) - g.order.indexOf(b)
      : (a, b) => total[b] - total[a] || a.localeCompare(b));
    const sel = state.sel[g.key];
    return `<div class="f-group"><div class="f-label">${g.label}<button class="clr${sel.size ? ' on' : ''}" data-clr="${g.key}" type="button">clear</button></div><div class="chips">` +
      keys.map(v => `<button type="button" class="chip${sel.has(v) ? ' on' : ''}${!all[v] && !sel.has(v) ? ' zero' : ''}" data-g="${g.key}" data-v="${esc(v)}" aria-pressed="${sel.has(v)}">${esc(v)}<span class="n">${all[v]}</span></button>`).join('') +
      `</div></div>`;
  }).join('');
}

function render() {
  const list = PEOPLE.filter(p => match(p));
  const d = state.dir === 'asc' ? 1 : -1;
  list.sort((a, b) => {
    let r = state.sort === 'name' ? a.name.localeCompare(b.name) : (a[state.sort] < b[state.sort] ? -1 : a[state.sort] > b[state.sort] ? 1 : 0);
    if (!r) r = state.sort === 'added' ? a.born - b.born : a.name.localeCompare(b.name);
    return r * d;
  });
  const hit = (g, v) => state.sel[g].has(v) ? ' hit' : '';
  document.getElementById('rows').innerHTML = list.map(p => `<tr class="row" data-href="${p.f}.html">
    <td class="c-main"><div class="p-name"><a href="${p.f}.html">${esc(p.name)}</a></div><div class="p-desc">${esc(p.desc)}</div></td>
    <td class="c-years">${years(p)}<span class="era">${p.era}</span></td>
    <td class="c-nat"><div class="tags">${p.nat.map(v => `<span class="tag${hit('nat', v)}" data-g="nat" data-v="${esc(v)}">${esc(v)}</span>`).join('')}</div></td>
    <td class="c-genre"><div class="tags">${p.genre.map(v => `<span class="tag${hit('genre', v)}" data-g="genre" data-v="${esc(v)}">${esc(v)}</span>`).join('')}</div></td>
    <td class="c-added">${p.added}</td>
  </tr>`).join('');
  document.getElementById('cnt').textContent = list.length;
  document.getElementById('tot').textContent = PEOPLE.length;
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  document.getElementById('active').innerHTML = GROUPS.flatMap(g => [...state.sel[g.key]].map(v => `<span data-g="${g.key}" data-v="${esc(v)}">${esc(v)}</span>`)).join('');
  document.getElementById('sort').value = state.sort + ':' + state.dir;
  document.querySelectorAll('.list th.sortable').forEach(th => {
    th.querySelector('.ar').textContent = th.dataset.k === state.sort ? (state.dir === 'asc' ? '↑' : '↓') : '';
  });
  renderGroups();
  const nSel = GROUPS.reduce((a, g) => a + state.sel[g.key].size, 0);
  document.getElementById('ftoggle').textContent = nSel ? 'Filters (' + nSel + ')' : 'Filters';
  saveHash();
}

function toggle(g, v) { const s = state.sel[g]; s.has(v) ? s.delete(v) : s.add(v); render(); }

/* URLのハッシュに状態を持たせる（共有・リロード用） */
function saveHash() {
  const p = new URLSearchParams();
  if (state.q) p.set('q', state.q);
  if (state.sort !== 'added' || state.dir !== 'desc') p.set('sort', state.sort + ':' + state.dir);
  GROUPS.forEach(g => { if (state.sel[g.key].size) p.set(g.key, [...state.sel[g.key]].join('|')); });
  const h = p.toString();
  history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
}
function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.q = (p.get('q') || '').toLowerCase();
  document.getElementById('q').value = p.get('q') || '';
  const [k, d] = (p.get('sort') || 'added:desc').split(':');
  state.sort = k; state.dir = d;
  GROUPS.forEach(g => { state.sel[g.key] = new Set((p.get(g.key) || '').split('|').filter(Boolean)); });
}

document.addEventListener('click', e => {
  const chip = e.target.closest('.chip, .tag, .active-tags span');
  if (chip) { e.stopPropagation(); toggle(chip.dataset.g, chip.dataset.v); return; }
  const clr = e.target.closest('[data-clr]');
  if (clr) { state.sel[clr.dataset.clr].clear(); render(); return; }
  const th = e.target.closest('.list th.sortable');
  if (th) {
    const k = th.dataset.k;
    if (state.sort === k) state.dir = state.dir === 'asc' ? 'desc' : 'asc';
    else { state.sort = k; state.dir = k === 'added' ? 'desc' : 'asc'; }
    render(); return;
  }
  const row = e.target.closest('tr.row');
  if (row && !e.target.closest('a')) location.href = row.dataset.href;
});
document.getElementById('ftoggle').addEventListener('click', e => {
  const f = document.getElementById('filters'); f.classList.toggle('open');
  e.target.setAttribute('aria-expanded', f.classList.contains('open'));
});
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
document.getElementById('sort').addEventListener('change', e => { [state.sort, state.dir] = e.target.value.split(':'); render(); });
document.getElementById('reset').addEventListener('click', () => {
  state.q = ''; document.getElementById('q').value = '';
  state.sort = 'added'; state.dir = 'desc';
  GROUPS.forEach(g => state.sel[g.key].clear());
  render();
});

loadHash();
render();
const last = PEOPLE.map(p => p.added).sort().pop();
document.getElementById('stPeople').textContent = PEOPLE.length + ' people';
document.getElementById('stUpdated').textContent = last.slice(0, 7).replace('-', '.');
</script>
